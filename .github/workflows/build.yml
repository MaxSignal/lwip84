name: Build

# Builds the TI-84 Plus / Plus SE operating system on every push to main,
# runs the host-side tests, and publishes the signed OS upgrades (.8xu) and
# flash images (.rom) as a GitHub release.
#
# Toolchain: SDCC 4.4.0 (prebuilt, from SourceForge; 4.5.0 miscompiles
# variable shifts) and KnightOS mktiupgrade (built from source). The .8xu
# files are signed with TI's public OS key 0A, fetched by tools/get-key.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  SDCC_VERSION: '4.4.0'
  MKTIUPGRADE_REF: '6997263'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SDCC_BIN: ${{ github.workspace }}/.tools/sdcc-4.4.0/bin
      TOOLS: ${{ github.workspace }}/.tools/bin
      TMPDIR: ${{ github.workspace }}/.tools/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: .tools
          key: ti84p-tools-sdcc${{ env.SDCC_VERSION }}-mktiupgrade${{ env.MKTIUPGRADE_REF }}-rabbitsign

      - name: Install toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y scdoc
          mkdir -p .tools/bin
          curl -fsSL -o sdcc.tar.bz2 \
            "https://sourceforge.net/projects/sdcc/files/sdcc-linux-amd64/${SDCC_VERSION}/sdcc-${SDCC_VERSION}-amd64-unknown-linux2.5.tar.bz2/download"
          tar xjf sdcc.tar.bz2 -C .tools
          rm sdcc.tar.bz2
          git clone -q https://github.com/KnightOS/mktiupgrade .tools/mktiupgrade-src
          git -C .tools/mktiupgrade-src checkout -q "$MKTIUPGRADE_REF"
          make -C .tools/mktiupgrade-src mktiupgrade
          cp .tools/mktiupgrade-src/mktiupgrade .tools/bin/
          rm -rf .tools/mktiupgrade-src
          # app signing (key 0104) for the TI-OS applications
          git clone -q --depth 1 https://github.com/abbrev/rabbitsign .tools/rabbitsign-src
          (cd .tools/rabbitsign-src && ./configure -q && make -s)
          cp .tools/rabbitsign-src/src/rabbitsign .tools/bin/
          rm -rf .tools/rabbitsign-src

      - name: Toolchain versions
        run: |
          mkdir -p "$TMPDIR"
          "$SDCC_BIN/sdcc" --version | head -1
          ls -l "$TOOLS"

      - name: Fetch the OS signing key
        run: tools/get-key.sh

      - name: Build TI-84 Plus
        run: make -j"$(nproc)"

      - name: Build TI-84 Plus SE
        run: make -j"$(nproc)" MODEL=84pse

      - name: Build for 48 KiB of RAM
        run: |
          make -j"$(nproc)" RAM48=1
          make -j"$(nproc)" RAM48=1 MODEL=84pse

      - name: Build the TI-OS applications
        run: |
          make -j"$(nproc)" PLATFORM=tios APP=browser
          make -j"$(nproc)" PLATFORM=tios APP=ssh

      - name: Build debug images
        run: |
          make -j"$(nproc)" DEBUG=1
          make -j"$(nproc)" DEBUG=1 MODEL=84pse

      - name: Build the emulator
        run: make emu

      - name: Crypto tests
        run: |
          gcc -O2 -I lib/crypto -o "$TMPDIR/crypto_test" tests/crypto_test.c lib/crypto/sha256.c lib/crypto/chacha.c lib/crypto/x25519.c
          "$TMPDIR/crypto_test"
          gcc -O2 -o "$TMPDIR/z80run" tests/z80run.c
          Z80RUN="$TMPDIR/z80run" python3 tests/asm_test.py sha256 20
          Z80RUN="$TMPDIR/z80run" python3 tests/asm_test.py poly1305 30
          Z80RUN="$TMPDIR/z80run" python3 tests/asm_test.py aes 30
          Z80RUN="$TMPDIR/z80run" python3 tests/asm_test.py ghash 20
          gcc -O2 -I lib/crypto -I tests -o "$TMPDIR/aes_test" tests/aes_test.c lib/crypto/aes.c
          "$TMPDIR/aes_test"

      - name: HTML renderer tests
        run: |
          gcc -O2 -Wall -DHTML_HOST -I app/browser -I lib/font -o "$TMPDIR/html_test" app/browser/tests/html_test.c app/browser/html.c lib/font/font.c
          python3 tools/mkfont84.py fonts/fonts.txt "$TMPDIR/font.bin"
          python3 tools/mkjis84.py "$TMPDIR/jis.bin"
          sh app/browser/tests/html_check.sh "$TMPDIR/html_test" "$TMPDIR/font.bin" "$TMPDIR/jis.bin"

      - name: Input method tests
        run: |
          gcc -O2 -Wall -DDICT_HOST -I lib/ime -o "$TMPDIR/ime_test" lib/ime/tests/ime_test.c lib/ime/ime.c lib/ime/dict.c
          "$TMPDIR/ime_test"
          python3 tools/mkdict84.py build dict "$TMPDIR/dict.bin"
          "$TMPDIR/ime_test" "$TMPDIR/dict.bin"

      - name: Collect files
        run: |
          set -e
          mkdir -p dist
          cp build-84p/lwip84.8xu             dist/lwip84-ti84plus.8xu
          cp build-84p/lwip84.rom             dist/lwip84-ti84plus.rom
          cp build-84pse/lwip84.8xu           dist/lwip84-ti84plusse.8xu
          cp build-84pse/lwip84.rom           dist/lwip84-ti84plusse.rom
          cp build-84p-48k/lwip84.8xu         dist/lwip84-ti84plus-48k.8xu
          cp build-84pse-48k/lwip84.8xu       dist/lwip84-ti84plusse-48k.8xu
          cp build-tios-browser/lwip84.8xk    dist/lwip84-browser.8xk
          cp build-tios-ssh/lwip84.8xk        dist/lwip84-ssh.8xk
          cp build-debug-84p/lwip84.8xu       dist/lwip84-ti84plus-debug.8xu
          cp build-debug-84pse/lwip84.8xu     dist/lwip84-ti84plusse-debug.8xu
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lwip84-${{ github.sha }}
          path: dist/

      - name: Create release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="build-${GITHUB_RUN_NUMBER}"
          short=$(git rev-parse --short HEAD)
          prev=$(git tag --list 'build-*' --sort=-v:refname --merged HEAD | head -1)
          {
            echo "lwIP-84+ OS for the TI-84 Plus / Plus SE, built from ${short}."
            echo
            echo "| File | Contents |"
            echo "|---|---|"
            echo "| \`lwip84-ti84plus.8xu\` | OS upgrade for the TI-84 Plus |"
            echo "| \`lwip84-ti84plusse.8xu\` | OS upgrade for the TI-84 Plus Silver Edition |"
            echo "| \`*-48k.8xu\` | for the later calculators with 48 KiB of RAM (smaller buffers) |"
            echo "| \`lwip84-browser.8xk\`, \`lwip84-ssh.8xk\` | TI-OS applications (TI-84 Plus, 128 KiB of RAM) |"
            echo
            echo "Send the .8xu from boot mode (see README.md). It replaces TI-OS;"
            echo "reinstall TI-OS the same way to go back. The .8xk are sent to"
            echo "TI-OS like any app (see platform/README.md)."
            echo
            echo "Debug builds, flash images for emulators and SHA256SUMS are in"
            echo "the artifact of the workflow run."
            echo
            if [ -n "$prev" ]; then
              echo "### Changes since ${prev}"
              range="${prev}..HEAD"
            else
              echo "### Recent changes"
              range="-20 HEAD"
            fi
            echo
            git log --no-merges --format='- %s (%h)' $range
          } > notes.md
          cat notes.md
          # only the signed release files: the OS upgrades and the apps
          files=$(ls dist/*.8xu dist/*.8xk | grep -v -- '-debug\.')
          gh release create "$tag" $files \
            --target "$GITHUB_SHA" \
            --title "lwIP-84+ build ${GITHUB_RUN_NUMBER} (${short})" \
            --notes-file notes.md
